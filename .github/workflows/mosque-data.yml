name: Mosque data

# The mosques and mushollas of Indonesia as data/mosques.tsv: OpenStreetMap's, from
# Geofabrik's daily extract, those Overture Places adds where OpenStreetMap has none, and
# the suggestions of the app's users that the owner approved, kept as issues of this
# repository (scripts/mosque-data/build.sh). Every week, or by hand, a change becomes a pull request
# from the branch data/mosques, which this workflow merges once CI passes; the first
# dataset waits for a person (publish.sh). On a pull request that changes the build, it
# only builds and checks: the change meets real data before it is merged.
on:
  schedule:
    # Tuesdays, 02:23 WIB
    - cron: "23 19 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mosque-data.yml"
      - "scripts/mosque-data/**"
      - "src/lib/mosque-contrib.ts"
      - "src/lib/mosque-osm.ts"
      - "src/lib/mosque-tsv.ts"

concurrency:
  group: mosque-data-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing by default; each job asks for what it needs
permissions: {}

jobs:
  build:
    name: build dataset
    # Not in forks: they would open pull requests against themselves every week
    if: github.repository == 'irfan-yulianto/si-imsak'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the branch data/mosques
      pull-requests: write # open and merge its pull request
      actions: write # start CI on it
      issues: read # the users' suggestions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only publish.sh pushes, and it doesn't run on pull requests
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install osmium and the Overture client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "overturemaps==1.0.2"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Download Geofabrik's extract of Indonesia
        working-directory: ${{ runner.temp }}
        run: |
          url=https://download.geofabrik.de/asia/indonesia-latest.osm.pbf
          curl -fsSL --retry 3 --retry-delay 30 -o indonesia-latest.osm.pbf "$url"
          curl -fsSL --retry 3 --retry-delay 30 -o indonesia-latest.osm.pbf.md5 "$url.md5"
          md5sum -c indonesia-latest.osm.pbf.md5
          ls -lh indonesia-latest.osm.pbf

      - name: Download Overture's places in Indonesia
        working-directory: ${{ runner.temp }}
        run: |
          # The latest release: Overture keeps only the last two months' online
          release=$(python3 -c "from overturemaps.core import get_latest_release; print(get_latest_release())")
          echo "OVERTURE_RELEASE=$release" >> "$GITHUB_ENV"
          overturemaps download --release="$release" --bbox=95,-11,141,6 -f geoparquet --type=place -o places.parquet
          python3 "$GITHUB_WORKSPACE/scripts/mosque-data/overture.py" places.parquet overture.jsonl

      - name: Collect the users' suggestions the owner approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues?labels=usulan-masjid&state=all&per_page=100" \
            --jq '.[] | tojson' > "$RUNNER_TEMP/suggestions.jsonl"
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/mosque-data/contributions.mjs \
            "$RUNNER_TEMP/suggestions.jsonl" "$RUNNER_TEMP/contrib.jsonl"

      - name: Build
        run: |
          git show HEAD:data/mosques.tsv > "$RUNNER_TEMP/previous.tsv" 2>/dev/null || rm -f "$RUNNER_TEMP/previous.tsv"
          scripts/mosque-data/build.sh "$RUNNER_TEMP/indonesia-latest.osm.pbf" "$RUNNER_TEMP" "$RUNNER_TEMP/overture.jsonl" "$OVERTURE_RELEASE" "$RUNNER_TEMP/contrib.jsonl"

      - name: Check
        run: |
          status=0
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/mosque-data/validate.mjs \
            data/mosques.tsv "$RUNNER_TEMP/previous.tsv" "$RUNNER_TEMP/summary.md" || status=$?
          { echo "### Mosque data"; echo; cat "$RUNNER_TEMP/summary.md"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Keep the dataset for a look
        if: always() && hashFiles('data/mosques.tsv') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosques
          path: |
            data/mosques.tsv
            data/mosques.meta.json
          retention-days: 14

      - name: Pull request
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/mosque-data/publish.sh
